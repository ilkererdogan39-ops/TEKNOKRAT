# ========================================
# Kurumsal LMS - Docker Compose
# ========================================
# Kullanim:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down
# ========================================

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lmsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmspassword123}
      POSTGRES_DB: lms_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmsuser -d lms_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LMS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://lmsuser:${POSTGRES_PASSWORD:-lmspassword123}@postgres:5432/lms_database
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
